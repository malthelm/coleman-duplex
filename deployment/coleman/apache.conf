<VirtualHost *:80>
    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteRule ^/$ /index.php?fc=module&module=colemanstay&controller=stay [END,QSA]
    RewriteRule ^/apartments/(one|two)/?$ /index.php?fc=module&module=colemanstay&controller=stay&apartment=$1 [END,QSA]
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <LocationMatch "^/(install|install-dev|install-cli|deployment|config|\.git)(/|$)">
        Require all denied
    </LocationMatch>
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    SetEnvIf X-Forwarded-Proto https HTTPS=on
</VirtualHost>
